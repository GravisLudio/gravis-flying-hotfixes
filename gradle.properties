org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom no se lleva bien con el configuration cache; Create Fly tampoco.
org.gradle.configuration-cache=false

# JDK 25 explicito para este proyecto, para no tocar el JAVA_HOME del sistema (sigue en 21).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.4.7-hotspot

## Environment Properties
# Alineado con Create Fly 26.2-rc-2-6.0.9-1 (misma plantilla que Create: Connected Fly Port).
minecraft_version = 26.2-rc-2
loader_version    = 0.19.3
loom_version      = 1.16-SNAPSHOT
fabric_version    = 0.152.0+26.2

## Dependency Properties
# Create Fly embebe Create + Flywheel + Ponder + Catnip. Solo se compila contra el; en juego es
# una dependencia obligatoria (fabric.mod.json: "create").
create_fly_version = 26.2-rc-2-6.0.9-1

## Mod Properties
mod_id          = gravis_flying_hotfixes
mod_name        = Create: Gravis's Flying Hotfixes
mod_license     = MIT
mod_version     = 1.1.0
mod_group_id    = com.gravisludio.flyinghotfixes
mod_authors     = GravisLudio
mod_description = Small standalone fixes for bugs in Create Fly (the Fabric port of Create): shutdown crash, schematicannon checklist, rich soil farmland cost, mechanical arm slots and uppercase modes, south-facing crafting blueprint crash, and Spouts that could not fill items of other mods (single-slot fluid storages, stacks). No blocks, no items, installs on its own.
